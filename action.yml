name: Install Octave
description: Installs Octave for the given platform type.

inputs:
  install-type:
    description: 'Platform install type: ubuntu, macos, windows, ubuntu-flatpak, or ubuntu-snap'
    required: true

runs:
  using: composite
  steps:
    - name: Deprecation warning
      shell: bash
      run: |
        echo "### :warning: Deprecated action" >> "$GITHUB_STEP_SUMMARY"
        echo "This local Octave install action will be removed in octave_kernel v2." >> "$GITHUB_STEP_SUMMARY"
        echo "Switch to [Calysto/octave_action@v1](https://github.com/Calysto/octave_action) instead." >> "$GITHUB_STEP_SUMMARY"
        echo "See https://github.com/Calysto/octave_kernel/issues/348 for details." >> "$GITHUB_STEP_SUMMARY"

    - name: Setup octave
      uses: calysto/octave_action@v1
      with:
        install-type: ${{ inputs.install-type }}
