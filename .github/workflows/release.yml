name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        # See https://python-poetry.org/docs/cli/#version for a description of version types.
        description: "Version to release: a version number (e.g. 1.0.0rc4) or one of: patch, minor, major, prepatch, preminor, premajor, prerelease"
        required: true
        type: string
      dry_run:
        description: "Dry run (deletes draft release, does not push changes, does not publish to PyPI or quay.io)"
        required: false
        type: boolean
        default: false
      changelog_body:
        description: "Custom release notes (overrides auto-generated changelog). Use \\n for newlines, or trigger via 'gh workflow run' for real multiline input."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 9 * * *"

jobs:
  release:
    if: github.event_name != 'schedule' || github.repository == 'Calysto/octave_kernel'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      dry_run: ${{ steps.dry-run.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: calysto/maintainer_tools/actions/base-setup@v1
      - name: Set dry_run output
        id: dry-run
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
        run: echo "value=$DRY_RUN" >> "$GITHUB_OUTPUT"
      - uses: calysto/maintainer_tools/actions/release@v1
        id: release
        with:
          version: ${{ github.event_name == 'schedule' && '10.10.10.10' || inputs.version }}
          dry_run: ${{ steps.dry-run.outputs.value }}
          changelog_body: ${{ inputs.changelog_body }}
          app_id: ${{ github.event_name != 'schedule' && vars.APP_ID || '' }}
          app_private_key: ${{ github.event_name != 'schedule' && secrets.APP_PRIVATE_KEY || '' }}
          ref: ${{ github.ref_name }}

  # Build the package from the release tag so the artifact matches what was released.
  build-package:
    if: github.event_name != 'schedule' || github.repository == 'Calysto/octave_kernel'
    name: Build & verify package
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: calysto/maintainer_tools/actions/build@v1

  publish-docker:
    if: github.event_name != 'schedule' || github.repository == 'Calysto/octave_kernel'
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ needs.release.outputs.dry_run != 'true' && !contains(needs.release.outputs.tag, 'dev') && !contains(needs.release.outputs.tag, 'rc') && !contains(needs.release.outputs.tag, 'alpha') && !contains(needs.release.outputs.tag, 'beta') }}
          tags: |
            quay.io/calysto_kernels/octave_kernel:latest
            quay.io/calysto_kernels/octave_kernel:${{ needs.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'schedule' || github.repository == 'Calysto/octave_kernel'
    needs: [release, build-package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload package to PyPI
        if: ${{ needs.release.outputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: false
